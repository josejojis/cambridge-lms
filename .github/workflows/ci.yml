name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres] # development database and production database
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: elite, POSTGRES_PASSWORD: elite, POSTGRES_DB: elite_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U elite" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://elite:elite@localhost:5432/elite_test' || 'file:./ci.db' }}
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      APP_ORIGIN: http://localhost:5000
      BETTER_AUTH_URL: http://localhost:5000
      SEED_DEMO_PASSWORD: CiDemoPass!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: PostgreSQL schema is in sync with the canonical schema
        run: node backend/scripts/sync-schemas.mjs --check
      - run: npm run db:generate -w backend
      - run: npm run db:deploy -w backend        # postgres: includes row-level security policies
      - run: npm run db:seed -w backend
      - run: npm run typecheck
      - run: npm test
      - if: matrix.db == 'sqlite'
        run: npm run build -w frontend
      - if: matrix.db == 'sqlite'
        name: End-to-end + accessibility (phone and desktop viewports)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w frontend
      - if: matrix.db == 'sqlite'
        run: npm audit --omit=dev --audit-level=high
