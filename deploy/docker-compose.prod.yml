# Self-hosted production stack: Caddy (automatic HTTPS) + API + worker + PostgreSQL 17.
# On the VPS:  cp deploy/.env.prod.example deploy/.env.prod  (fill it in), then
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
name: elite-revision

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elite_revision
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U elite -d elite_revision"], interval: 10s, retries: 5 }

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: .env.prod
    environment: { DATABASE_URL: "postgresql://elite:${POSTGRES_PASSWORD}@db:5432/elite_revision" }
    command: sh -c "npm run db:deploy -w backend && npm run db:seed:production -w backend"
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    env_file: .env.prod
    environment: { DATABASE_URL: "postgresql://elite:${POSTGRES_PASSWORD}@db:5432/elite_revision", PORT: "4000" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"], interval: 30s, retries: 3 }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    env_file: .env.prod
    environment: { DATABASE_URL: "postgresql://elite:${POSTGRES_PASSWORD}@db:5432/elite_revision" }
    command: ["npm", "run", "worker:prod", "-w", "backend"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [./backups:/backups]
    # Nightly compressed dump, 14-day retention. Copy /backups off-site (e.g. rclone to B2/S3) and test restores monthly.
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U elite -Fc elite_revision > /backups/elite-$$(date +%F).dump; find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }

volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
